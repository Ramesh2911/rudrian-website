server {
    listen 80;
    listen [::]:80;

    server_name admin.rudrianlogistics.com;

    # Certbot webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /var/www/admin.rudrianlogistics.com;
    index index.html;

    # Vite build assets — long cache
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
